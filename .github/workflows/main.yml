name: Build & Deploy Monorepo

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile and Bundle Distributions
        run: |
          mkdir -p dist
          cp plugins/message-tools/manifest.json dist/
          cp plugins/message-tools/index.js dist/

      - name: Generate Repository Index File
        run: bunx revenge-plugin generate-index --dist dist --base-url https://github.io

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
